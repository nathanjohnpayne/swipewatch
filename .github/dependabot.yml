version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Every other minor and patch update shares one PR. Majors open as
      # individual PRs (mergepath#1802).
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Peer-coupled family (scripts/ci/dependabot-coupled-families.json,
      # mergepath#2162). Keep it first so its members move together.
      eslint-core:
        patterns:
          - "eslint"
          - "@eslint/*"
      # Every other minor and patch update shares one PR. Majors open as
      # individual PRs (mergepath#1802).
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
